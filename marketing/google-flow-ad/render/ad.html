<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FH hook ad stage</title>
<!--
  The 20.0 s FlexcityHeadquarters "hook" ad as one deterministic HTML stage.
  Open with ?lang=en|fr&ar=16x9|9x16. render.cjs calls window.setTime(t) for every frame (and for sub-frames
  inside window.BLUR windows, for motion blur) and screenshots it.

  Storyboard: 1 hook (a desk of chat notifications, sticky notes, a crossed-out printout and a broken sheet)
  -> 2 reveal (the clutter is masked down into the FH mark on a mist field, one light sweep)
  -> 3 what it is (left-aligned supers; tight push-ins on the real control each word names, from hi-res captures)
  -> 4 motto (centred, the only lime accent is "One HQ.") -> 5 end card (holds still for the last 2.5 s).

  Timing: voice word times from voiceover/TIMINGS.md; every scene cut lands on the music's eighth-note grid
  (120 bpm, first beat 0.475 s, measured from voiceover/music.mp3 by onset analysis; see GRID below).
  Motion: one easing family (expo out for entrances and camera moves, expo in-out for travelling moves,
  quint in for the one exit), no linear tweens, no overshoot, no loops.
  Type: Plus Jakarta Sans on one scale (TYPE below), display tracking -0.02em; left-aligned in section 3,
  centred in sections 1, 2, 4 and 5. 9:16 is laid out on its own, key text inside y 269..1536 (top 14% and
  bottom 20% kept clear for the platforms' UI).
  Brand only: no job titles or role cards in the copy. Notification names and texts are generic and fictional.
-->
<style>
  @font-face {
    font-family: 'PJS';
    src: url('../../../apps/web/src/fonts/plus-jakarta-sans-latin-wght-normal.woff2') format('woff2');
    font-weight: 200 800;
  }
  :root {
    --ink: #0B1F22; --ink2: #3D5356; --teal: #0F766E; --teal-light: #5EEAD4; --night: #0B1416; --deep: #0B3B3C;
    --mist: #E1F1EE; --neutral: #F3F7F6; --lime: #C5F23A; --verm: #FF8A7A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  body { font-family: 'PJS', sans-serif; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  #stage { position: relative; overflow: hidden; background: #fff; }
  .h #stage { width: 1920px; height: 1080px; }
  .v #stage { width: 1080px; height: 1920px; }
  .layer { position: absolute; inset: 0; overflow: hidden; display: none; }
  .abs { position: absolute; left: 0; top: 0; }
  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; }

  /* ---------- 1. hook: a desk ---------- */
  .hook { background: radial-gradient(ellipse 80% 70% at 38% 30%, #E7E8E4 0%, #D8DAD5 55%, #C4C7C2 100%); }
  .scene { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .props { position: absolute; inset: 0; filter: saturate(0.62); }
  /* light comes from the top left: every prop casts the same soft shadow down and to the right */
  .prop { position: absolute; left: 0; top: 0; filter: drop-shadow(5px 9px 9px rgba(40,44,40,0.22)) drop-shadow(1px 2px 1.5px rgba(40,44,40,0.18)); }
  .inner { position: relative; transform-origin: 50% 50%; }
  .notif { display: flex; gap: 26px; align-items: flex-start; background: rgba(252,252,251,0.97); border-radius: 38px;
    padding: 28px 44px 30px 28px; white-space: nowrap; }
  .notif .ic { flex: none; width: 72px; height: 72px; border-radius: 18px; background: linear-gradient(160deg, #73848D, #4E5D66);
    display: grid; place-items: center; }
  .notif .hd { display: flex; align-items: baseline; gap: 16px; font-size: 30px; color: #6B7579; font-weight: 500; }
  .notif .hd b { color: #1E2628; font-weight: 700; font-size: 33px; }
  .notif .msg { font-size: 40px; color: #1E2628; font-weight: 500; margin-top: 4px; letter-spacing: -0.005em; }
  .sticky { width: 300px; height: 284px; padding: 48px 30px 24px; font-weight: 700; font-size: 42px; line-height: 1.16;
    color: #3B3524; white-space: pre-line; letter-spacing: -0.01em;
    background: linear-gradient(170deg, #FFEE9A 0%, #FFE36E 55%, #F6D650 100%); }
  .sticky.pink { background: linear-gradient(170deg, #FFD9E6 0%, #FFC6D9 55%, #F7B4CB 100%); color: #45303A; }
  .sticky .tape { position: absolute; left: 50%; top: -16px; width: 118px; height: 34px; margin-left: -59px;
    background: rgba(250,250,245,0.62); transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .paper { width: 340px; height: 440px; background: #FCFCFA; padding: 34px 30px; zoom: 1.25; }
  .paper .ttl { font-weight: 800; font-size: 34px; color: #2B3133; margin-bottom: 8px; letter-spacing: -0.01em; }
  .paper .sub { font-weight: 500; font-size: 20px; color: #7A8486; margin-bottom: 20px; }
  .paper .row { display: flex; gap: 12px; align-items: center; height: 44px; border-top: 2px solid #E6E9E8; }
  .paper .row s { display: block; width: 22px; height: 22px; border: 2.5px solid #B9C0C2; border-radius: 4px; flex: none; }
  .paper .row b { display: block; height: 9px; border-radius: 5px; background: #C9CFD1; }
  .paper svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .sheet { background: #fff; border-collapse: collapse; font-family: 'Carlito', 'Liberation Sans', sans-serif; color: #202426; font-size: 34px; }
  .sheet td { border: 1px solid #D0D5D7; padding: 0 16px; height: 54px; white-space: nowrap; }
  .sheet tr:first-child td, .sheet td:first-child { background: #EEF0F1; color: #6A7275; text-align: center; font-size: 27px; }
  .sheet td.err { color: #C0392B; font-weight: 700; }
  .sheet td.sel { box-shadow: inset 0 0 0 3px #1E8E3E; }
  .chip { background: #fff; font-family: 'Carlito', 'Liberation Sans', sans-serif; font-weight: 700; font-size: 46px; color: #C0392B;
    padding: 10px 26px; box-shadow: inset 0 0 0 3px #1E8E3E; white-space: nowrap; }
  .qcard { position: absolute; left: 0; top: 0; background: #101718; color: #fff; border-radius: 34px;
    box-shadow: 0 2px 0 rgba(255,255,255,0.06) inset, 14px 26px 50px rgba(20,24,22,0.38), 3px 6px 10px rgba(20,24,22,0.25);
    font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .qcard .ln { white-space: nowrap; }
  .qcard .w { color: rgba(255,255,255,0.34); }

  /* ---------- 2. reveal ---------- */
  .reveal { background: radial-gradient(ellipse 70% 70% at 50% 42%, #F6FBFA 0%, #E6F3F0 55%, #D3E9E4 100%); }
  .wm { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .line { overflow: hidden; padding-bottom: 0.1em; margin-bottom: -0.1em; }
  .line > span { display: inline-block; }
  .wm1 { font-weight: 800; color: var(--ink); letter-spacing: -0.03em; line-height: 1.02; }
  .wm2 { font-weight: 600; color: var(--teal); text-transform: uppercase; line-height: 1; white-space: nowrap; letter-spacing: 0.34em; padding-left: 0.34em; }
  .sweep { position: absolute; overflow: hidden; }
  .sweep i { position: absolute; top: -20%; bottom: -20%; width: 46%;
    background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0) 100%); }

  /* ---------- 3. what it is ---------- */
  .montage { background: radial-gradient(ellipse 90% 80% at 20% 10%, #FFFFFF 0%, #F4F8F7 50%, #E9F1EF 100%); }
  .beat { position: absolute; inset: 0; display: none; }
  .sup { position: absolute; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; line-height: 1.04; white-space: nowrap; }
  .note { position: absolute; font-weight: 600; color: #4A5E60; display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  .note i { display: inline-block; border-radius: 50%; background: var(--teal); }
  .panel { position: absolute; overflow: hidden; border-radius: 30px;
    box-shadow: 0 0 0 1px rgba(11,31,34,0.07), 10px 24px 54px -18px rgba(11,31,34,0.30), 3px 8px 16px -6px rgba(11,31,34,0.14); }
  .panel img { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: block; }
  .panel img.feather { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%),
      linear-gradient(180deg, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .built { background: radial-gradient(ellipse 90% 90% at 15% 20%, #0F4A4A 0%, #0B3536 45%, #0A2224 100%); }
  .built .sup { color: #fff; }
  .phone { position: absolute; background: #0F1314; box-shadow: inset 0 0 0 2px #2C3436, inset 0 0 0 5px #0F1314,
    14px 30px 60px -16px rgba(11,31,34,0.42), 4px 10px 20px -6px rgba(11,31,34,0.22); }
  .phone .scr { position: absolute; overflow: hidden; background: #fff; }
  .phone .scr img { width: 100%; height: 100%; display: block; }

  /* ---------- 4. motto ---------- */
  .brand { background: radial-gradient(ellipse 85% 80% at 30% 18%, #14897F 0%, #0F766E 45%, #0B4F4B 100%); }
  .motto { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .motto .ph { font-weight: 800; color: #fff; letter-spacing: -0.02em; line-height: 1.06; white-space: nowrap; }
  .motto .ph.accent span { color: var(--lime); }
  .tile { background: #fff; display: grid; place-items: center; box-shadow: 8px 18px 40px -10px rgba(0,0,0,0.35); }

  /* ---------- 5. end card ---------- */
  .end { background: radial-gradient(ellipse 75% 70% at 50% 40%, #FFFFFF 0%, #F2F9F7 55%, #DFF0EC 100%); }
  .stack { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .cta { display: inline-flex; align-items: center; background: var(--teal); color: #fff; font-weight: 700; border-radius: 999px;
    white-space: nowrap; letter-spacing: -0.01em; box-shadow: 6px 16px 34px -10px rgba(15,118,110,0.55), 1px 3px 6px rgba(15,118,110,0.25); }
  .url { font-weight: 600; color: var(--ink); white-space: nowrap; letter-spacing: -0.005em; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <clipPath id="markClip" clipPathUnits="userSpaceOnUse"></clipPath>
  </defs>
</svg>
<div id="stage"></div>
<script>
const q = new URLSearchParams(location.search);
const LANG = q.get('lang') === 'fr' ? 'fr' : 'en';
const V = q.get('ar') === '9x16';
const AR = V ? 'v' : 'h';
document.documentElement.className = AR;
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const fr = LANG === 'fr', sfx = fr ? '-fr' : '';
const A = 'assets/';
const MARK = '../../../brand/fh-mark.svg';

// ---- Type scale (px). One scale per aspect ratio; display sizes take -0.02em tracking. ----
const TYPE = V ? { display: 116, head: 104, question: 88, cta: 58, body: 44, caption: 30, wm1: 150, wm2: 46, wmEnd1: 118, wmEnd2: 38 }
               : { display: 156, head: 112, question: 100, cta: 58, body: 46, caption: 28, wm1: 150, wm2: 46, wmEnd1: 112, wmEnd2: 36 };
const SAFE = V ? { top: 269, bottom: 1536, left: 90, right: 990 } : { top: 96, bottom: 984, left: 140, right: 1780 };

// ---- Music grid: 120 bpm, first beat at 0.4747 s on the mix timeline (onset analysis of voiceover/music.mp3,
// which starts at 0.000 s in the mix). Cuts sit on eighth notes: g(k) = 0.4747 + k * 0.24985 s. ----
const g = k => 0.4747 + k * 0.24985;

// ---- Word start times (s) on the final 20.0 s timeline, from voiceover/TIMINGS.md; cuts as grid indices. ----
const TM = {
  en: {
    hook: [['Still', 0.26], ['juggling', 0.58], ['shifts', 1.06], ['by', 1.46], ['text,', 1.70, 1], ['paper', 2.34, 1], ['and', 2.74], ['spreadsheet?', 2.90, 1]],
    lines: { h: [3, 3, 2], v: [2, 3, 2, 1] },
    flexcity: 4.50, hq: 5.06, sched: 6.38, clock: 7.18, pay: 8.02, built: 9.22, lang1: 10.82, lang2: 11.54, phone: 12.10,
    motto: [13.46, 14.54, 15.54],
    cut: { meet: g(14), sched: g(23), clock: g(26), pay: g(30), built: g(34), lang: g(41), phone: g(46), brand: g(51), end: g(64) },
  },
  fr: {
    hook: [['Encore', 0.36], ['des', 0.58], ['quarts', 0.70], ['gérés', 0.98], ['par', 1.30], ['texto,', 1.46, 1], ['papier', 2.10, 1], ['et', 2.46], ['chiffrier?', 2.58, 1]],
    lines: { h: [4, 3, 2], v: [2, 2, 2, 2, 1] },
    flexcity: 4.42, hq: 5.06, sched: 6.42, clock: 7.14, pay: 7.90, built: 9.10, lang1: 10.62, lang2: 11.34, phone: 12.22,
    motto: [13.74, 14.78, 15.74],
    // the end card comes in on the beat while "QG" finishes, so it can hold still for 2.5 s
    cut: { meet: g(13), sched: g(23), clock: g(26), pay: g(29), built: g(34), lang: g(40), phone: g(46), brand: g(52), end: g(65) },
  },
}[LANG];
const C = TM.cut;

// ---- On-screen copy. Supers are verbatim from the storyboard; line breaks are set per aspect ratio. ----
const COPY = {
  en: {
    sched: [['Scheduling'], ['Scheduling']], clock: [['Time clocks'], ['Time clocks']], pay: [['Payroll export'], ['Payroll export']],
    built: [['Built for', 'Canadian cities'], ['Built for', 'Canadian cities']],
    lang: [['English · Français'], ['English', 'Français']], phone: [['On any phone'], ['On any phone']],
    motto: ['Every shift.', 'Every site.', 'One HQ.'], cta: 'Try the live demo', note: 'Demo screens, sample data',
    notifs: [['Sam', 'Can anyone cover Saturday?'], ['Priya', 'Who’s on at 6 a.m.?'], ['Marc', 'Can I swap my Tuesday?'], ['Jess', 'Who can take my shift?'],
             ['Dev', 'Running late, sorry!'], ['Noor', 'Is the new schedule out?'], ['Alex', 'Need two more for Friday!'], ['Ben', 'Did the schedule change?']],
    now: 'now', stickies: ['Sat 7–3\n???', 'Who’s\nclosing?', 'Swap Tue\nfor Thu?'],
    paper: 'Schedule', paperSub: 'Week of Nov 9 — v3 FINAL (2)',
    sheet: [['', 'A', 'B', 'C', 'D'], ['1', '7–3', '??', '3–11', '#REF!'], ['2', '??', '7–3', '#REF!', 'TBD'], ['3', '3–11', 'TBD', '??', '7–3']],
    chips: ['#REF!', '??', 'TBD'],
  },
  fr: {
    sched: [['Horaires'], ['Horaires']], clock: [['Pointage'], ['Pointage']], pay: [['Exportation de la paie'], ['Exportation', 'de la paie']],
    built: [['Conçu pour', 'les villes canadiennes'], ['Conçu pour', 'les villes', 'canadiennes']],
    lang: [['Français · English'], ['Français', 'English']], phone: [['Sur tout téléphone'], ['Sur tout', 'téléphone']],
    motto: ['Chaque quart.', 'Chaque site.', 'Un seul QG.'], cta: 'Essayer la démo', note: 'Écrans de démo, données fictives',
    notifs: [['Sam', 'Quelqu’un peut me remplacer samedi?'], ['Priya', 'Qui travaille à 6 h?'], ['Marc', 'Je peux échanger mon mardi?'], ['Julie', 'Qui peut prendre mon quart?'],
             ['Dev', 'En retard, désolé!'], ['Noor', 'Le nouvel horaire est sorti?'], ['Alex', 'Il manque deux personnes vendredi!'], ['Ben', 'L’horaire a changé?']],
    now: 'maintenant', stickies: ['Samedi\n7 h–15 h ???', 'Qui\nferme?', 'Échanger\nmar./jeu.?'],
    paper: 'Horaire', paperSub: 'Semaine du 9 nov. — v3 FINAL (2)',
    sheet: [['', 'A', 'B', 'C', 'D'], ['1', '7 h–15 h', '??', '15 h–23 h', '#REF!'], ['2', '??', '7 h–15 h', '#REF!', 'À voir'], ['3', '15 h–23 h', 'À voir', '??', '7 h–15 h']],
    chips: ['#REF!', '??', 'À voir'],
  },
}[LANG];
const URL_TEXT = 'flexcity-headquarters-iota.vercel.app';
const pick = pair => pair[V ? 1 : 0];

// ---------- helpers ----------
const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, d) => clamp((t - a) / d);
// One easing family: exponential. Exact 0 and 1 at the ends, so a finished move is perfectly still.
const E = {
  io: x => { x = clamp(x); if (x <= 0) return 0; if (x >= 1) return 1; return x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2; },
};
// expo out normalised so it ends exactly at 1 (1 - 2^-10 is 0.999, which would leave a 0.1% drift)
const EO = x => { x = clamp(x); return x >= 1 ? 1 : (1 - Math.pow(2, -10 * x)) / (1 - Math.pow(2, -10)); };
const DUR = { text: 0.5, move: 0.6, cam: 0.7 };   // consistent durations: type entrances, object entrances, camera moves
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const css = (e, o) => { for (const k in o) e.style[k] = typeof o[k] === 'number' ? o[k] + 'px' : o[k]; return e; };
const U = [], FITS = [];
const layer = (cls, a, b) => { const L = el('div', 'layer ' + cls); L.win = [a, b]; stage.appendChild(L); return L; };
// Motion-blur windows: render.cjs takes 4 sub-frames over a 180-degree shutter inside these.
const BLUR = [];
const blur = (a, d) => BLUR.push([a, a + d]);

const NOISE = 'url("data:image/svg+xml;utf8,' + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.25 0 0 0 0 0.25 0 0 0 0 0.22 0 0 0 1.2 -0.1'/></filter><rect width='256' height='256' filter='url(%23n)'/></svg>").replace(/%2523/g, '%23') + '")';
const grain = (parent, op) => { const gr = el('div', 'grain'); gr.style.backgroundImage = NOISE; gr.style.opacity = op; parent.appendChild(gr); return gr; };

// display text as lines that rise out of their own line box (mask reveal)
function lines(texts, cls, size) {
  const box = el('div', cls); css(box, { fontSize: size });
  const spans = texts.map(t => { const ln = el('div', 'line'); const s = el('span', '', esc(t)); ln.appendChild(s); box.appendChild(ln); return s; });
  box.spans = spans;
  return box;
}
const rise = (s, t, t0, d = DUR.text) => { const k = EO(P(t, t0, d)); s.style.transform = k >= 1 ? 'none' : `translateY(${((1 - k) * 105).toFixed(2)}%)`; };

// ======================================================================
// 1. HOOK (0 -> cut.meet)
// ======================================================================
const hook = layer('hook', 0, C.meet + 0.95);
const scene = el('div', 'scene'); css(scene, { width: W, height: H }); hook.appendChild(scene);
grain(scene, 0.12);
const props = el('div', 'props'); scene.appendChild(props);
// keyword groups land on the grid: first eighth at or after (word - 0.14 s), then one eighth apart
const kw = TM.hook.filter(w => w[2]).map(w => w[1]);
const grp = kw.map(t => g(Math.ceil((t - 0.14 - 0.4747) / 0.24985)));
const at = (gi, slot) => gi < 0 ? -1 : grp[gi] + slot * 0.24985;

const NOTIF_ICON = '<svg viewBox="0 0 32 32" width="32" height="32"><path d="M16 6C9.4 6 4 10.3 4 15.6c0 3 1.7 5.6 4.4 7.4L7.6 27l4.6-2.6c1.2.3 2.5.5 3.8.5 6.6 0 12-4.3 12-9.6S22.6 6 16 6Z" fill="#fff"/></svg>';
function makeProp(kind, i) {
  const inner = el('div', 'inner');
  if (kind === 'notif') {
    inner.classList.add('notif');
    const [who, msg] = COPY.notifs[i];
    inner.innerHTML = `<div class="ic">${NOTIF_ICON}</div><div><div class="hd"><b>${esc(who)}</b><span>${esc(COPY.now)}</span></div><div class="msg">${esc(msg)}</div></div>`;
  } else if (kind === 'sticky') {
    inner.classList.add('sticky'); if (i === 1) inner.classList.add('pink');
    inner.appendChild(el('span', 'tape'));
    inner.appendChild(document.createTextNode(COPY.stickies[i]));
    grain(inner, 0.10);
  } else if (kind === 'paper') {
    inner.classList.add('paper');
    inner.appendChild(el('div', 'ttl', esc(COPY.paper)));
    inner.appendChild(el('div', 'sub', esc(COPY.paperSub)));
    for (let r = 0; r < 7; r++) {
      const row = el('div', 'row'); row.appendChild(el('s'));
      [[110, 70], [80, 120], [140, 60], [100, 90], [70, 130], [130, 60], [90, 100]][r].forEach(w => { const b = el('b'); b.style.width = w + 'px'; row.appendChild(b); });
      inner.appendChild(row);
    }
    grain(inner, 0.07);
    const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 340 440');
    inner.strokes = ['M 26 150 C 110 138, 220 168, 316 140', 'M 40 410 L 300 120', 'M 52 118 L 306 404'].map(d => {
      const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none');
      p.setAttribute('stroke', '#C8283A'); p.setAttribute('stroke-width', '9'); p.setAttribute('stroke-linecap', 'round');
      p.setAttribute('stroke-opacity', '0.9'); p.setAttribute('pathLength', '1'); p.setAttribute('stroke-dasharray', '1');
      p.setAttribute('stroke-dashoffset', '1'); svg.appendChild(p); return p;
    });
    inner.appendChild(svg);
  } else if (kind === 'sheet') {
    const tb = el('table', 'sheet');
    COPY.sheet.forEach((r, ri) => { const tr = el('tr'); r.forEach((c, ci) => tr.appendChild(el('td', (c.startsWith('#') ? 'err' : '') + (ri === 2 && ci === 3 ? ' sel' : ''), esc(c)))); tb.appendChild(tr); });
    inner.appendChild(tb);
  } else {
    inner.classList.add('chip'); inner.textContent = COPY.chips[i];
  }
  return inner;
}
// [kind, index, group (-1 = there from the first frame, 0 text / 1 paper / 2 spreadsheet), slot, x, y (centre), rotation]
const LAYOUT = V ? [
  ['notif', 0, -1, 0, 470, 120, -2], ['notif', 1, -1, 0, 640, 290, 2], ['notif', 2, -1, 0, 430, 1290, -1.5], ['notif', 3, -1, 0, 620, 1460, 1.5],

// A panel shows a hi-res capture (css size cw x ch, pixel density dpr) framed by a rectangle in the capture's
// css px: [cx, cy, width]. The camera pushes from one framing to the next (expo in-out; width in log space).
function panel(B, src, cw, ch, bg, feather, box = PANEL) {
  const pn = el('div', 'panel'); css(pn, { left: box.x, top: box.y, width: box.w, height: box.h, background: bg });

}
const between = (f0, f1, e) => [lerp(f0[0], f1[0], e), lerp(f0[1], f1[1], e), f0[2] * Math.pow(f1[2] / f0[2], e)];

U.push(t => {
  ENTER.forEach((n, i) => {
    const k = EO(P(t, C.end + i * 0.04, 0.45));
    n.style.opacity = clamp(k * 1.6);
    n.style.transform = k >= 1 ? 'none' : `translateY(${((1 - k) * (i ? 26 : 34)).toFixed(2)}px)`;
  });
  // one nudge of the arrow toward the address: out (expo out), back (expo in-out), then still
  const out = EO(P(t, tNudge, 0.12)), back = E.io(P(t, tNudge + 0.12, 0.18));
  const dx = 12 * out * (1 - back);
  arrow.style.transform = dx === 0 ? 'none' : `translateX(${dx.toFixed(2)}px)`;
});

// ---------- frame driver ----------
const LAYERS = [...stage.querySelectorAll('.layer')];
window.setTime = function (t) {
  for (const L of LAYERS) L.style.display = t >= L.win[0] && t < L.win[1] ? 'block' : 'none';
  for (const u of U) u(t);
};
window.BLUR = BLUR;
window.CUTS = C;
window.ready = Promise.all([
  document.fonts.load('800 80px PJS'), document.fonts.load('700 40px PJS'), document.fonts.load('600 30px PJS'), document.fonts.load('500 30px PJS'),
  document.fonts.load('700 30px Carlito'),
  ...[...document.images].map(i => i.decode()),
]).then(() => document.fonts.ready).then(() => {
  LAYERS.forEach(L => { L.style.display = 'block'; });
  stage.querySelectorAll('.beat').forEach(b => { b.style.display = 'block'; });
  FITS.forEach(f => f());
  setTime(0); return true;
});
</script>
</body>
