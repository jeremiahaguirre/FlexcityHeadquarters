# Weekly dependency updates, so security patches arrive as reviewable pull requests.
# Every ecosystem that ends up in production is covered: npm packages, the GitHub Actions the
# workflows pin by commit SHA, the Docker base image (pinned by digest) and the Terraform provider
# (pinned in versions.tf and .terraform.lock.hcl). SECURITY-AUDIT SEC-55, SEC-74.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # A release must be this old before Dependabot proposes it, so a hijacked package that is
    # caught and pulled within days never reaches a pull request. Security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: terraform
    directory: /ops/terraform
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
