name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flexcity_test
      APP_DATABASE_URL: postgresql://flexcity_app:change-me@localhost:5432/flexcity_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      # Known vulnerabilities in production dependencies (reported; Dependabot raises the fixes).
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: .
        continue-on-error: true
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm test
      - name: Check migrations match the schema
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE flexcity_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
        env:
          # Prisma 7: the shadow database comes from prisma.config.ts (no --shadow-database-url flag).
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flexcity_shadow
      - run: npm run test:integration

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspace apps/site --include-workspace-root
        working-directory: .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Fonts in the built site are the committed woff2, from our own origin only.
      - run: npx vitest run src/lib/selfHostedFonts.test.ts

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      # The web app's tests share the API's permission matrix, which uses Prisma's generated types.
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run typecheck
      - run: npm test
      # Phone tests (iPhone 13 screen) against the static demo: sample data, no API or database.
      - name: Build static demo
        run: npm run build:demo
      - name: Fonts in the build are our own
        run: npx vitest run src/lib/selfHostedFonts.test.ts
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Phone tests
        run: npx playwright test --trace off
