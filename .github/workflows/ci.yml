name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job runs all dependency code (npm ci, builds, tests): read-only token, never kept on disk.
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flexcity_test
      APP_DATABASE_URL: postgresql://flexcity_app:change-me@localhost:5432/flexcity_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      # Known vulnerabilities in production dependencies (reported; Dependabot raises the fixes).
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: .
        continue-on-error: true
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm test
      - name: Check migrations match the schema
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE flexcity_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
        env:
          # Prisma 7: the shadow database comes from prisma.config.ts (no --shadow-database-url flag).
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flexcity_shadow
      - run: npm run test:integration

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspace apps/site --include-workspace-root
        working-directory: .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Fonts in the built site are the committed woff2, from our own origin only.
      - run: npx vitest run src/lib/selfHostedFonts.test.ts

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      # The web app's tests share the API's permission matrix, which uses Prisma's generated types.
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run typecheck
      - run: npm test
      # Phone tests (iPhone 13 screen) against the static demo: sample data, no API or database.
      # The live build (what production serves) carries none of the demo (ARCHITECTURE-REVIEW A15).
      - name: Live build has no demo code or data
        run: NEXT_DIST_DIR=.next-live npx next build && node scripts/check-live-build.mjs .next-live
      - name: Build static demo
        run: npm run build:demo
      - name: Fonts in the build are our own
        run: npx vitest run src/lib/selfHostedFonts.test.ts
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Phone tests
        run: npx playwright test --trace off

  # What production runs (ARCHITECTURE-REVIEW A12): the three images built from this commit (the
  # web image is the live `next build`, not the demo), then booted the way ECS runs them, with a
  # TLS-only database whose owner is not a superuser (ops/ci/image-smoke.sh).
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the api, migrate and web images
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          docker build --target api -t fh-api:ci .
          docker build --target migrate -t fh-migrate:ci .
          docker build --target web --build-arg NEXT_PUBLIC_RELEASE=ci --build-arg NEXT_PUBLIC_SITE_URL=https://www.example.ca -t fh-web:ci .
      - name: Boot them as in production (migrations and owner scripts as a non-superuser)
        run: TAG=ci bash ops/ci/image-smoke.sh

  # ops/terraform: formatted, valid, and its tests (mocked AWS, no account) pass.
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ops/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      # The committed lock file, when there is one, pins the provider's checksums.
      - run: if [ -f .terraform.lock.hcl ]; then terraform init -backend=false -input=false -lockfile=readonly; else terraform init -backend=false -input=false; fi
      - run: terraform validate
      - run: terraform test
