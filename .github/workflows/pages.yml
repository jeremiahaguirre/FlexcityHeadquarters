name: Deploy demo to GitHub Pages

# Builds the web app as a static demo (sample data, no API) and publishes it to
# https://<owner>.github.io/<repo>/. Requires Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Read-only by default. Only the deploy job, which runs no dependency code, may publish to Pages
# and mint an OIDC token; the build job (npm ci, next build) gets neither (SEC-54).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The web app's tests share the API's permission matrix, which uses Prisma's generated types.
      - run: npx prisma generate
        working-directory: apps/api
      - name: Build static demo
        working-directory: apps/web
        env:
          NEXT_PUBLIC_DEMO: '1'
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: '1'
          # The marketing site's hosts, for the demo's "Back to the website" button (empty = the defaults in src/lib/demoBack.ts).
          NEXT_PUBLIC_SITE_HOSTS: ${{ vars.SITE_HOSTS }}
        run: npx next build --webpack
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
