name: Deploy demo to GitHub Pages

# Builds the web app as a static demo (sample data, no API) and publishes it to
# https://<owner>.github.io/<repo>/. Requires Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The web app's tests share the API's permission matrix, which uses Prisma's generated types.
      - run: npx prisma generate
        working-directory: apps/api
      - name: Build static demo
        working-directory: apps/web
        env:
          NEXT_PUBLIC_DEMO: '1'
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: npx next build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
